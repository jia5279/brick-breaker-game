<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brick Breaker</title>
  <style>
    :root{--bg:#edf7ff;--card:#ffffffdd;--ink:#172443;--muted:#627292;--line:#bdd8f5;--stage1:#bfeaff;--stage2:#effaff;--panel:#ffffffed;--accent:#267bea;--accent2:#85dfbc;--brick1:#ff6d9d;--shadow:#5e8cbd40;color-scheme:light}
    :root[data-theme="dark"]{--bg:#05091d;--card:#0c1432dd;--ink:#eff6ff;--muted:#aebce2;--line:#3d5193;--stage1:#111d4d;--stage2:#060a1c;--panel:#10183dee;--accent:#72ecff;--accent2:#a9ff9c;--shadow:#0009;color-scheme:dark}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 10%,var(--stage1),var(--bg) 58%);font-family:ui-rounded,"Pretendard",system-ui,sans-serif;color:var(--ink);transition:background .25s,color .25s}
    .shell{width:min(96vw,820px);padding:20px;border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 22px 65px var(--shadow);backdrop-filter:blur(12px)}
    header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}h1{margin:0;font-size:clamp(1.25rem,3.6vw,2rem);letter-spacing:.1em;font-weight:900;color:var(--accent)}
    .head-actions,.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:72px;padding:6px 9px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:center;font-size:.72rem;color:var(--muted)}.stat b{display:block;color:var(--ink);font-size:1.03rem}.icon-btn{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:8px 10px;font:inherit;font-weight:700;cursor:pointer}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px}.stage{position:relative;aspect-ratio:16/10;overflow:hidden;border:1px solid var(--line);border-radius:17px;background:linear-gradient(var(--stage1),var(--stage2));box-shadow:inset 0 0 35px #2459a322}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:#07122a45;text-align:center;transition:opacity .2s}.overlay.hidden{opacity:0;pointer-events:none}.panel{width:min(100%,390px);padding:23px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 10px 30px var(--shadow)}.panel h2{margin:0 0 8px;color:var(--accent);font-size:1.45rem}.panel p{margin:0 0 15px;line-height:1.55;color:var(--muted)}
    button.primary{border:0;border-radius:999px;padding:11px 20px;color:#072033;background:linear-gradient(90deg,var(--accent),var(--accent2));font:inherit;font-weight:900;cursor:pointer}.name-row{display:flex;gap:8px;margin:12px 0}.name-row input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}.hidden{display:none}
    aside{padding:13px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}aside h2{margin:0 0 9px;font-size:.93rem;color:var(--accent)}ol{margin:0;padding-left:27px}li{padding:7px 0 6px 1px;border-bottom:1px solid var(--line);font-size:.81rem}li:last-child{border:0}.rank-name{display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rank-score{display:block;color:var(--muted);font-size:.74rem}footer{margin:12px 3px 0;text-align:center;color:var(--muted);font-size:.8rem}kbd{padding:2px 5px;border-radius:4px;background:var(--line);color:var(--ink);font-family:inherit}
    @media(max-width:650px){body{padding:9px}.shell{padding:13px;border-radius:18px}.layout{grid-template-columns:1fr}.ranking{order:2;display:grid;grid-template-columns:90px 1fr;gap:4px 12px;align-items:start}.ranking h2{margin-top:5px}.ranking ol{display:grid;grid-template-columns:repeat(3,1fr);gap:0 9px;padding-left:21px}.rank-name{max-width:72px}header{align-items:flex-start}.head-actions{justify-content:flex-end}.stat{min-width:57px}}
  </style>
</head>
<body>
<main class="shell">
    <header><h1>BRICK BREAKER</h1><div class="head-actions"><button class="icon-btn" id="theme" type="button" aria-label="&#53580;&#47560; &#48320;&#44221;">&#9790; &#45796;&#53356;</button><div class="stats"><div class="stat">&#51216;&#49688;<b id="score">0000</b></div><div class="stat">&#47785;&#49704;<b id="lives">3</b></div><div class="stat">&#47112;&#48296;<b id="level">1</b></div></div></div></header>
  <div class="layout"><section class="stage"><canvas id="game" aria-label="&#48317;&#46028; &#44648;&#44592; &#44172;&#51076;"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="message">&#48317;&#46028;&#51012; &#47784;&#46160; &#48512;&#49688;&#49464;&#50836;!</h2><p id="description">&#47560;&#50864;&#49828;/&#53552;&#52824; &#46608;&#45716; <kbd>&larr;</kbd> <kbd>&rarr;</kbd>&#47196; &#54056;&#46308;&#51012; &#51060;&#46041;&#54616;&#49464;&#50836;.</p><div class="name-row hidden" id="nameRow"><input id="playerName" maxlength="12" placeholder="&#45768;&#45348;&#51076;" aria-label="&#45768;&#45348;&#51076;"></div><button class="primary" id="start" type="button">&#44172;&#51076; &#49884;&#51089;</button></div></div></section><aside class="ranking"><h2>&#127942; &#47196;&#52972; &#47021;&#53433; 10</h2><ol id="rankList"></ol></aside></div>
  <footer>&#47784;&#46304; &#47196;&#52972; &#47029;&#53433;&#51008; &#51060; &#48652;&#46972;&#50864;&#51200;&#50640; &#50504;&#51204;&#54616;&#44172; &#51200;&#51109;&#46121;&#45768;&#45796;.</footer>
</main>
<script>
(() => {
  const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),message=document.querySelector('#message'),description=document.querySelector('#description'),start=document.querySelector('#start'),nameRow=document.querySelector('#nameRow'),nameInput=document.querySelector('#playerName'),themeButton=document.querySelector('#theme');
  const scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),levelEl=document.querySelector('#level'),rankList=document.querySelector('#rankList');
  const KEY='brick-breaker-rankings-v1',THEME='brick-breaker-theme-v1',colors=['#ff5d9e','#ff9156','#ffe45e','#7fe6a0','#55cdef','#9b84ff'];
  let W=0,H=0,dpr=1,game,last=0,keys=Object.create(null),needsRank=false;
  const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
  function resize(){const r=canvas.getBoundingClientRect();dpr=devicePixelRatio||1;W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(game){game.paddle.y=H-35;game.paddle.x=clamp(game.paddle.x,0,W-game.paddle.w)}}
  function makeLevel(keepScore=true){const l=game.level,cols=9,rows=Math.min(l+3,7),gap=6,side=22,top=46,bw=(W-side*2-gap*(cols-1))/cols,bh=20;game.bricks=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)game.bricks.push({x:side+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,color:colors[(r+c+l)%colors.length],alive:true});game.paddle={x:W/2-54,y:H-35,w:108,h:13,vx:0,maxSpeed:620,accel:3300};game.ball={x:W/2,y:H-59,r:7,vx:(Math.random()<.5?-1:1)*(250+l*15),vy:-310-l*16};if(!keepScore)game.score=0}
  function reset(){game={score:0,lives:3,level:1,running:false};makeLevel(false);updateStats()}
  function updateStats(){scoreEl.textContent=String(game.score).padStart(4,'0');livesEl.textContent=game.lives;levelEl.textContent=game.level}
  function show(title,text,label,withName=false){message.textContent=title;description.textContent=text;start.textContent=label;nameRow.classList.toggle('hidden',!withName);overlay.classList.remove('hidden');if(withName)setTimeout(()=>nameInput.focus(),0)}
  function readRanks(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
  function renderRanks(){const ranks=readRanks();rankList.replaceChildren(...(ranks.length?ranks:[{name:'---',score:0}]).map((r,i)=>{const li=document.createElement('li'),n=document.createElement('span'),s=document.createElement('span');n.className='rank-name';n.textContent=`${i+1}. ${r.name}`;s.className='rank-score';s.textContent=`${r.score.toLocaleString()} pts`;li.append(n,s);return li}))}
  function saveRank(){if(!needsRank)return;const name=(nameInput.value.trim()||'PLAYER').slice(0,12),ranks=readRanks();ranks.push({name,score:game.score,date:Date.now()});ranks.sort((a,b)=>b.score-a.score||a.date-b.date);localStorage.setItem(KEY,JSON.stringify(ranks.slice(0,10)));needsRank=false;renderRanks()}
  function rectCircleCollision(ball,br){const nx=clamp(ball.x,br.x,br.x+br.w),ny=clamp(ball.y,br.y,br.y+br.h),dx=ball.x-nx,dy=ball.y-ny;return dx*dx+dy*dy<=ball.r*ball.r}
  function bounceBrick(br,b){const overlapL=(b.x+b.r)-br.x,overlapR=(br.x+br.w)-(b.x-b.r),overlapT=(b.y+b.r)-br.y,overlapB=(br.y+br.h)-(b.y-b.r);const min=Math.min(overlapL,overlapR,overlapT,overlapB);if(min===overlapL||min===overlapR)b.vx*=-1;else b.vy*=-1}
  function moveBall(dt){const b=game.ball;const distance=Math.hypot(b.vx*dt,b.vy*dt);const steps=Math.max(1,Math.ceil(distance/(b.r*.65)));const step=dt/steps;for(let i=0;i<steps;i++){b.x+=b.vx*step;b.y+=b.vy*step;if(b.x-b.r<=0||b.x+b.r>=W){b.x=clamp(b.x,b.r,W-b.r);b.vx*=-1}if(b.y-b.r<=0){b.y=b.r;b.vy*=-1}
      const p=game.paddle;if(b.vy>0&&b.y+b.r>=p.y&&b.y-b.r<=p.y+p.h&&b.x+b.r>=p.x&&b.x-b.r<=p.x+p.w){const hit=clamp((b.x-(p.x+p.w/2))/(p.w/2),-1,1);b.vx=hit*430+p.vx*.18;b.vy=-Math.max(270,Math.abs(b.vy));b.y=p.y-b.r-0.1}
      let brickHit=false;for(const br of game.bricks){if(br.alive&&rectCircleCollision(b,br)){br.alive=false;game.score+=10*game.level;bounceBrick(br,b);updateStats();brickHit=true;break}}if(brickHit)continue;if(b.y-b.r>H){loseBall();return}if(!game.bricks.some(br=>br.alive)){game.level++;updateStats();makeLevel();game.running=false;show('\uB808\uBCA8 \uD074\uB9AC\uC5B4!','\uB2E4\uC74C \uB2E8\uACC4\uC5D0\uC11C\uB294 \uACF5\uC774 \uB354 \uBE60\uB985\uB2C8\uB2E4.','\uB2E4\uC74C \uB808\uBCA8');return}}
  }
  function loseBall(){game.lives--;updateStats();game.running=false;if(game.lives<=0){needsRank=true;show('\uAC8C\uC784 \uC624\uBC84',`\uCD5C\uC885 \uC810\uC218: ${game.score.toLocaleString()}\uC810`,'\uC810\uC218 \uB4F1\uB85D',true)}else{const p=game.paddle,b=game.ball;b.x=W/2;b.y=H-59;b.vx=(Math.random()<.5?-1:1)*260;b.vy=-320;p.x=W/2-p.w/2;p.vx=0;show('\uACF5\uC744 \uB193\uCCE4\uC5B4\uC694!',`\uB0A8\uC740 \uBAA9\uC228: ${game.lives}\uAC1C`,'\uACC4\uC18D\uD558\uAE30')}}
  function update(dt){const p=game.paddle,dir=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0),target=dir*p.maxSpeed;p.vx+=(target-p.vx)*Math.min(1,p.accel*dt/p.maxSpeed);if(!dir)p.vx*=Math.pow(.0003,dt);p.x=clamp(p.x+p.vx*dt,0,W-p.w);moveBall(dt)}
  function draw(){const dark=document.documentElement.dataset.theme==='dark',g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,dark?'#111c4b':'#a9e4ff');g.addColorStop(1,dark?'#060a1b':'#effaff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle=dark?'#6583cf24':'#4890bf1f';for(let x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const br of game.bricks)if(br.alive){ctx.shadowColor=br.color;ctx.shadowBlur=9;ctx.fillStyle=br.color;ctx.beginPath();ctx.roundRect(br.x,br.y,br.w,br.h,5);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff8';ctx.fillRect(br.x+4,br.y+4,br.w-8,2)}const p=game.paddle;ctx.shadowColor='#36aaf4';ctx.shadowBlur=14;ctx.fillStyle='#3fbaf5';ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,7);ctx.fill();const b=game.ball;ctx.shadowColor='#fff';ctx.shadowBlur=18;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
  function frame(t){const dt=Math.min((t-last||0)/1000,.025);last=t;if(game.running)update(dt);draw();requestAnimationFrame(frame)}
  function pointerMove(e){const r=canvas.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;game.paddle.x=clamp(x-game.paddle.w/2,0,W-game.paddle.w);game.paddle.vx=0}
  addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);canvas.addEventListener('mousemove',pointerMove);canvas.addEventListener('touchmove',e=>{e.preventDefault();pointerMove(e)},{passive:false});
  start.addEventListener('click',()=>{if(needsRank){saveRank();reset();show('\uC900\uBE44 \uC644\uB8CC!','\uBC84\uD2BC\uC744 \uB20C\uB7EC \uC0C8 \uAC8C\uC784\uC744 \uC2DC\uC791\uD558\uC138\uC694.','\uAC8C\uC784 \uC2DC\uC791');return}overlay.classList.add('hidden');game.running=true});
  themeButton.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem(THEME,next);themeButton.innerHTML=next==='dark'?'&#9728; &#46972;&#51060;&#53944;':'&#9790; &#45796;&#53356;'});
  const savedTheme=localStorage.getItem(THEME)||'light';document.documentElement.dataset.theme=savedTheme;themeButton.innerHTML=savedTheme==='dark'?'&#9728; &#46972;&#51060;&#53944;':'&#9790; &#45796;&#53356;';resize();reset();renderRanks();requestAnimationFrame(frame);addEventListener('resize',resize);
})();
</script>
</body>
</html>
